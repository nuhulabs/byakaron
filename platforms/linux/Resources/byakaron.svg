<?xml version="1.0" encoding="UTF-8"?>
<!--
  Byakaron logo: a silver ব on a near-black tile. Used as the app icon and as
  the input-source icon next to "Byakaron (Bangla Phonetic)".

  The glyph is the same outline as the macOS icon (Byakaron_FG.svg), drawn as a
  plain <path> rather than <text> so it does not depend on a Bangla font being
  present in whatever renders it (the ibus panel does not always have full
  fontconfig available).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1319"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="443" y2="490">
      <stop offset="0"   stop-color="#e8ebee"/>
      <stop offset="0.3" stop-color="#c6cacf"/>
      <stop offset="0.5" stop-color="#b1b5b9"/>
      <stop offset="0.8" stop-color="#73777c"/>
      <stop offset="1"   stop-color="#5c6065"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <path transform="translate(119 101) scale(0.6165)" fill="url(#silver)"
