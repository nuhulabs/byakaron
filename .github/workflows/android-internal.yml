name: android-internal

on:
  push:
    branches:
      - feat/android
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to publish to'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal

permissions:
  contents: read

concurrency:
  group: android-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  pkg-android:
    name: pkg-android
    needs: prepare
    uses: ./.github/workflows/pkg.yml
    secrets: inherit
    with:
      linux: false
      macos: false
      windows: false
      android: true

  play-store:
    name: play-store
    needs: pkg-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: byakaron-android

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download android bundle
        uses: actions/download-artifact@v4
        with:
          name: byakaron-android
          path: dist

      - name: check aab bundle
        id: check_aab
        run: |
          if [[ -f "dist/Byakaron.aab" ]]; then
            echo "has_aab=true" >> "$GITHUB_OUTPUT"
            echo "Found Byakaron.aab ($(du -h dist/Byakaron.aab | cut -f1))"
          else
            echo "::error::Byakaron.aab not found in artifacts"
            echo "has_aab=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: check credentials
        id: check_creds
        env:
          KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::PLAY_STORE_JSON_KEY secret is not configured in byakaron-android environment"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: upload to Google Play Console
        if: steps.check_aab.outputs.has_aab == 'true' && steps.check_creds.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ secrets.PLAY_STORE_PACKAGE_NAME || 'com.nuhulabs.byakaron' }}
          releaseFiles: dist/Byakaron.aab
          track: ${{ inputs.track || secrets.PLAY_STORE_TRACK || 'internal' }}
          status: ${{ secrets.PLAY_STORE_STATUS || 'completed' }}
          changesNotSentForReview: true
