# Deploy apps/web to Cloudflare Workers (worker `byakaron`, apps/web/wrangler.jsonc).
#
# The worker is the wasm32-wasi build of the web app; its spell check reads the
# D1 database `DB`, filled separately by d1-import.yml. Setup: apps/web/README.md.
name: cd-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/cd-web.yml'
  workflow_dispatch:

concurrency:
  group: cd-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Runs wrangler.jsonc's build command (`zig build -Dtarget=wasm32-wasi
      # --release=small`), which also installs the static assets.
      - name: Bundle
        working-directory: apps/web
        run: npx wrangler@4.100.0 deploy --dry-run --outdir .wrangler-artifact --assets ../../zig-out/static

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            apps/web/.wrangler-artifact
            zig-out/static
          include-hidden-files: true
          retention-days: 1

  deploy:
    environment:
      name: byakaron-web
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Disable custom build (artifact is prebuilt)
        run: |
          sed -i '/"build": {/,/^\t},$/d' apps/web/wrangler.jsonc

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4
          workingDirectory: apps/web
          command: deploy .wrangler-artifact/main.js --no-bundle --assets ../../zig-out/static
