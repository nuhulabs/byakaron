# release: prepare → pkg (all os) → GitHub Release on this repo
#
# Artifacts (upload names → release files):
#   byakaron-linux-amd64 / byakaron-linux-arm64  → byakaron_<ver>_{amd64,arm64}.deb
#   byakaron-macos                               → Byakaron.dmg
#   byakaron-windows                             → Byakaron-Setup.exe
#   byakaron-android                             → Byakaron.apk + Byakaron.aab
#   byakaron-db                                  → Byakaron.db
#
# Debian keeps version in the .deb filename (pkg_ver_arch.deb). There is no
# universal amd64+arm64 .deb — Architecture is single-arch or all (data-only).
#
# Tag: v${build.zig.zon.version}. Push a matching annotated tag, or dispatch
# to dry-run (artifacts only).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          [[ -n "$version" ]] || { echo "::error::no .version in build.zig.zon"; exit 1; }
          tag="v${version}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            pushed="${{ github.ref_name }}"
            if [[ "$pushed" != "$tag" && "$pushed" != "$tag"-* ]]; then
              echo "::warning::tag $pushed does not match zon $tag; publishing as $pushed"
              tag="$pushed"
              version="${pushed#v}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag (zon version $version)"

  pkg:
    name: pkg
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version]
    uses: ./.github/workflows/pkg.yml
    secrets: inherit
    with:
      linux: true
      macos: true
      windows: true
      android: true
      version: ${{ needs.version.outputs.version }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version, pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          for f in Byakaron.dmg Byakaron-Setup.exe Byakaron.db; do
            [[ -f "$f" ]] || { echo "::error::$f is missing"; exit 1; }
          done
          for arch in amd64 arm64; do
            compgen -G "byakaron_*_$arch.deb" >/dev/null || { echo "::error::the $arch .deb is missing"; exit 1; }
          done
          [[ -f Byakaron.apk ]] || echo "::warning::publishing without Byakaron.apk"
          [[ -f Byakaron.aab ]] || echo "::warning::publishing without Byakaron.aab (Play Store bundle)"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          # %(contents) includes the PGP signature on signed tags — strip it.
          git tag -l --format='%(contents)' "$TAG" \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Byakaron ${TAG#v}" > "$RUNNER_TEMP/notes.md"

          flags=(--latest)
          [[ "$TAG" == *-* ]] && flags=(--prerelease --latest=false)
          # Replace a prior attempt for the same tag (e.g. retargeted publish).
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --title "Byakaron ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" ./*

          while read -r sum name; do
            got=$(gh release view "$TAG" --json assets \
              -q ".assets[] | select(.name == \"$name\") | .digest")
            [[ "$got" == "sha256:$sum" ]] || { echo "::error::$name: uploaded $got, built sha256:$sum"; exit 1; }
          done < SHA256SUMS
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
