# release: prepare → pkg (all os) → Byakaron-Assets (binaries) + byakaron (notes)
#
# Artifacts on nuhulabs/Byakaron-Assets (stable names → /releases/latest/download/…):
#   byakaron-linux-amd64 / byakaron-linux-arm64  → byakaron_{amd64,arm64}.deb
#   byakaron-macos                               → Byakaron.dmg
#   byakaron-windows                             → Byakaron-Setup.exe
#   byakaron-android                             → Byakaron.apk + Byakaron.aab
#
# Local `zig build package-linux` still writes byakaron_<ver>_<arch>.deb; publish
# renames for the public Assets release so the website/installer never need a
# versioned URL. Byakaron.db is baked into packages, not uploaded to Assets.
#
# The source repo gets a matching GitHub Release (notes + link to Assets, no
# binary attachments). Web deploy stays on cd.yml — download links are stable.
#
# Tag: v${build.zig.zon.version}. Push a matching annotated tag, or dispatch
# to dry-run (artifacts only).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          [[ -n "$version" ]] || { echo "::error::no .version in build.zig.zon"; exit 1; }
          tag="v${version}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            pushed="${{ github.ref_name }}"
            if [[ "$pushed" != "$tag" && "$pushed" != "$tag"-* ]]; then
              echo "::warning::tag $pushed does not match zon $tag; publishing as $pushed"
              tag="$pushed"
              version="${pushed#v}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag (zon version $version)"

  pkg:
    name: pkg
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version]
    uses: ./.github/workflows/pkg.yml
    secrets: inherit
    with:
      linux: true
      macos: true
      windows: true
      android: true
      version: ${{ needs.version.outputs.version }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version, pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.BYAKARON_ASSETS_TOKEN }}
          ASSETS_REPO: nuhulabs/Byakaron-Assets
          SOURCE_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          # Source-repo release uses the job token (not the Assets PAT).
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::BYAKARON_ASSETS_TOKEN is not set"; exit 1; }
          cd dist
          # prepare still uploads Byakaron.db for packaging; keep it off Assets.
          rm -f Byakaron.db mapping.txt

          for f in Byakaron.dmg Byakaron-Setup.exe; do
            [[ -f "$f" ]] || { echo "::error::$f is missing"; exit 1; }
          done
          for arch in amd64 arm64; do
            mapfile -t matches < <(compgen -G "byakaron_*_${arch}.deb" || true)
            [[ ${#matches[@]} -eq 1 ]] || {
              echo "::error::expected one byakaron_*_${arch}.deb, got: ${matches[*]-<none>}"
              exit 1
            }
            # Stable public name so /releases/latest/download/byakaron_${arch}.deb works.
            mv -f "${matches[0]}" "byakaron_${arch}.deb"
          done
          [[ -f Byakaron.apk ]] || echo "::warning::publishing without Byakaron.apk"
          [[ -f Byakaron.aab ]] || echo "::warning::publishing without Byakaron.aab (Play Store bundle)"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          # %(contents) includes the PGP signature on signed tags — strip it.
          git tag -l --format='%(contents)' "$TAG" \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Byakaron ${TAG#v}" > "$RUNNER_TEMP/notes.md"

          {
            echo
            echo "---"
            echo
            echo "Installers: https://github.com/${ASSETS_REPO}/releases/tag/${TAG}"
            echo "Latest downloads: https://github.com/${ASSETS_REPO}/releases/latest"
          } >> "$RUNNER_TEMP/notes.md"

          flags=(--latest)
          [[ "$TAG" == *-* ]] && flags=(--prerelease --latest=false)

          # Public binaries on Byakaron-Assets (stable asset names).
          gh release delete "$TAG" --repo "$ASSETS_REPO" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$ASSETS_REPO" --title "Byakaron ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" ./*

          while read -r sum name; do
            got=$(gh release view "$TAG" --repo "$ASSETS_REPO" --json assets \
              -q ".assets[] | select(.name == \"$name\") | .digest")
            [[ "$got" == "sha256:$sum" ]] || { echo "::error::$name: uploaded $got, built sha256:$sum"; exit 1; }
          done < SHA256SUMS
          echo "https://github.com/$ASSETS_REPO/releases/tag/$TAG"

          # Source repo: release notes only (private clone / changelog), no binaries.
          GH_TOKEN="$SOURCE_TOKEN" gh release delete "$TAG" --repo "$SOURCE_REPO" --yes 2>/dev/null || true
          GH_TOKEN="$SOURCE_TOKEN" gh release create "$TAG" --repo "$SOURCE_REPO" \
            --title "Byakaron ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "https://github.com/$SOURCE_REPO/releases/tag/$TAG"

  play-store:
    name: play-store
    needs: [publish, pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download android bundle
        uses: actions/download-artifact@v4
        with:
          name: byakaron-android
          path: dist

      - name: check aab bundle
        id: check_aab
        run: |
          if [[ -f "dist/Byakaron.aab" ]]; then
            echo "has_aab=true" >> "$GITHUB_OUTPUT"
            echo "Found Byakaron.aab ($(du -h dist/Byakaron.aab | cut -f1))"
          else
            echo "::warning::Byakaron.aab not found in artifacts, skipping Play Store upload"
            echo "has_aab=false" >> "$GITHUB_OUTPUT"
          fi

      - name: check credentials
        id: check_creds
        env:
          KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::warning::PLAY_STORE_JSON_KEY secret is not configured in repository secrets. Skipping Play Store upload."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: upload to Google Play Console
        if: steps.check_aab.outputs.has_aab == 'true' && steps.check_creds.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.nuhulabs.byakaron
          releaseFiles: dist/Byakaron.aab
          track: internal
          status: completed
          changesNotSentForReview: true
