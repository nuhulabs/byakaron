# release: prepare → pkg (all os) → publish to public nuhulabs/Byakaron-Assets
#
# Artifacts (upload names → release files):
#   byakaron-linux-amd64 / byakaron-linux-arm64  → byakaron_<ver>_{amd64,arm64}.deb
#   byakaron-macos                               → Byakaron.dmg
#   byakaron-windows                             → Byakaron-Setup.exe
#   byakaron-android                             → Byakaron.apk + Byakaron.aab
#
# Byakaron.db is built in prepare and baked into packages; it is not published
# on Byakaron-Assets (too large / not a public download).
#
# Debian keeps version in the .deb filename (pkg_ver_arch.deb). There is no
# universal amd64+arm64 .deb — Architecture is single-arch or all (data-only).
#
# Tag: v${build.zig.zon.version}. Push a matching annotated tag, or dispatch
# to dry-run (artifacts only). Binaries ship on Byakaron-Assets (public) so
# downloads work when this source repo is private.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          [[ -n "$version" ]] || { echo "::error::no .version in build.zig.zon"; exit 1; }
          tag="v${version}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            pushed="${{ github.ref_name }}"
            if [[ "$pushed" != "$tag" && "$pushed" != "$tag"-* ]]; then
              echo "::warning::tag $pushed does not match zon $tag; publishing as $pushed"
              tag="$pushed"
              version="${pushed#v}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag (zon version $version)"

  pkg:
    name: pkg
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version]
    uses: ./.github/workflows/pkg.yml
    secrets: inherit
    with:
      linux: true
      macos: true
      windows: true
      android: true
      version: ${{ needs.version.outputs.version }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, version, pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.BYAKARON_ASSETS_TOKEN }}
          ASSETS_REPO: nuhulabs/Byakaron-Assets
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::BYAKARON_ASSETS_TOKEN is not set"; exit 1; }
          cd dist
          # prepare still uploads Byakaron.db for packaging; keep it off Assets.
          rm -f Byakaron.db
          for f in Byakaron.dmg Byakaron-Setup.exe; do
            [[ -f "$f" ]] || { echo "::error::$f is missing"; exit 1; }
          done
          for arch in amd64 arm64; do
            compgen -G "byakaron_*_$arch.deb" >/dev/null || { echo "::error::the $arch .deb is missing"; exit 1; }
          done
          [[ -f Byakaron.apk ]] || echo "::warning::publishing without Byakaron.apk"
          [[ -f Byakaron.aab ]] || echo "::warning::publishing without Byakaron.aab (Play Store bundle)"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          # %(contents) includes the PGP signature on signed tags — strip it.
          git tag -l --format='%(contents)' "$TAG" \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Byakaron ${TAG#v}" > "$RUNNER_TEMP/notes.md"

          flags=(--latest)
          [[ "$TAG" == *-* ]] && flags=(--prerelease --latest=false)
          gh release delete "$TAG" --repo "$ASSETS_REPO" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$ASSETS_REPO" --title "Byakaron ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" ./*

          while read -r sum name; do
            got=$(gh release view "$TAG" --repo "$ASSETS_REPO" --json assets \
              -q ".assets[] | select(.name == \"$name\") | .digest")
            [[ "$got" == "sha256:$sum" ]] || { echo "::error::$name: uploaded $got, built sha256:$sum"; exit 1; }
          done < SHA256SUMS
          echo "https://github.com/$ASSETS_REPO/releases/tag/$TAG"

  # Refresh the download-page catalog and redeploy the Worker (links → Assets).
  deploy-web:
    name: deploy (web downloads)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: byakaron-web
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: update downloads.zon
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/update-downloads-zon.sh "$TAG" dist

      - name: commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/downloads.zon
          if git diff --cached --quiet; then
            echo "downloads.zon unchanged"
          else
            git commit -m "chore: refresh download catalog for ${{ needs.version.outputs.tag }}"
            git push origin HEAD:main
          fi

      # wrangler.jsonc runs `zig build zx …` as a custom build before deploy.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: deploy web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip web deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy
