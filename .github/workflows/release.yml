# release (the CD), three stages:
#
#   prepare         version + Byakaron.db
#   pack-<os>       linux, macos, windows, android: one job each, packing
#                   every CPU arch it ships with `zig build pack`;
#                   ios: an App Store .ipa (signed when the credentials are
#                   set); web: the Worker bundle + static site
#   publish-<dest>  each waits only for what it ships:
#                     github   every binary pack (tag, Byakaron-Assets, notes)
#                     android  pack-android (Google Play)
#                     ios      pack-ios (App Store Connect / TestFlight)
#                     web      pack-web (the site links to latest)
#
# Artifacts on nuhulabs/Byakaron-Assets (stable names → /releases/latest/download/…):
#   pack linux    → byakaron_{amd64,arm64}.deb, byakaron_{x86_64,aarch64}.pkg.tar.zst (Arch),
#                   byakaron_{x86_64,aarch64}.rpm (Fedora, RHEL, openSUSE)
#   pack macos    → Byakaron.dmg
#   pack windows  → Byakaron-Setup.exe
#   pack android  → Byakaron.apk + Byakaron.aab (the .aab also goes to Google Play)
#   pack ios      → Byakaron.ipa when signed (App Store only, never on Assets)
#   pack web      → nothing (Cloudflare Workers, never on Assets)
#
# Local `zig build pack -- linux` writes byakaron_<ver>_<arch>.deb (and
# `pack -- linux-arch` byakaron-<ver>-1-<arch>.pkg.tar.zst, `pack -- linux-rpm`
# byakaron-<ver>-1.<arch>.rpm); publish renames
# them for the public Assets release so the website/installer never need a
# versioned URL. Byakaron.db is baked into packages, not uploaded to Assets.
#
# The source repo gets a matching GitHub Release (notes + link to Assets, no
# binary attachments).
#
# Versions are build.zig.zon's .version without its suffix (27.0.0-dev →
# 27.0.0) plus the track:
#   internal, alpha, beta  v27.0.0-<track>.N, N counting from 0 per track
#                          (27.0.0-internal.0, .1, …), a prerelease
#   production             v27.0.0, the latest release
#   - dispatch: CI tags the next version for the chosen track, then builds
#     and publishes it; with `dry_run`, artifacts only.
#   - push a tag of that form: build and publish it (its track from the tag).
# The packages are built with that full version written into build.zig.zon.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      dry_run:
        description: Dry run
        type: boolean
        default: false

permissions:
  contents: read

# Two dispatched releases at once would pick the same N.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.0

jobs:
  # ── prepare ────────────────────────────────────────────────────────────────
  # The release version (and whether to publish it), and Byakaron.db, which
  # every package embeds. D1 migrations (zig build gen -- d1 + wrangler apply)
  # are run locally when the DB changes.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      track: ${{ steps.v.outputs.track }}
      publish: ${{ steps.v.outputs.publish }}
      create_tag: ${{ steps.v.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          zon=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          [[ -n "$zon" ]] || { echo "::error::no .version in build.zig.zon"; exit 1; }
          # The release is build.zig.zon's version without its suffix: bump
          # the zon version first (v0.1.1 and v0.1.2 once shipped .debs saying
          # 0.1.0).
          base="${zon%%-*}"

          publish=true
          create_tag=false
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            if [[ "$version" == "$base" ]]; then
              track=production
            elif [[ "$version" =~ ^"$base"-(internal|alpha|beta)\.[0-9]+$ ]]; then
              track="${BASH_REMATCH[1]}"
            else
              echo "::error::tag $REF_NAME is not v$base or v$base-<internal|alpha|beta>.N (build.zig.zon is $zon: bump it first)"
              exit 1
            fi
          else
            track="${INPUT_TRACK:-internal}"
            if [[ "$track" == "production" ]]; then
              version="$base"
            else
              # Next N after the highest v<base>-<track>.N tag on the remote, from 0.
              last=$(git ls-remote --tags --refs origin "refs/tags/v${base}-${track}.*" \
                | sed -n "s|.*refs/tags/v${base//./\\.}-${track}\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -1)
              version="${base}-${track}.$(( ${last:--1} + 1 ))"
            fi
            if [[ "$INPUT_DRY_RUN" == "true" ]]; then
              publish=false
            else
              create_tag=true
            fi
          fi

          tag="v${version}"
          if [[ "$create_tag" == "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "track=$track"
            echo "publish=$publish"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag ($track, build.zig.zon $zon) publish=$publish create_tag=$create_tag"

      # Keyed by src/data/db.zon alone (the dump date and a revision), so the
      # database is rebuilt only when that file changes, not on every edit to
      # the build or the version bump in build.zig.zon. Tag runs read the
      # cache main saved.
      - name: cache Byakaron.db
        id: cache
        uses: actions/cache@v4
        with:
          path: zig-out/db/Byakaron.db
          key: byakaron-db-${{ hashFiles('src/data/db.zon') }}

      - uses: mlugg/setup-zig@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Byakaron.db
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/zig-cache
          sudo chown "$USER" /mnt/zig-cache
          zig build gen --cache-dir /mnt/zig-cache -- db
          ls -lh zig-out/db/Byakaron.db

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-db
          path: zig-out/db/Byakaron.db
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # ── pack ───────────────────────────────────────────────────────────────────
  # One job per OS, each packing every CPU arch it ships with `zig build pack`
  # (Linux cross-compiles arm64 against its pinned sysroot; Android builds
  # every ABI into one bundle). .github/actions/pack-setup does the shared
  # start: version, Zig, Byakaron.db.

  pack-linux:
    name: pack (linux)
    needs: prepare
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build deps -- linux
          # sudo fetched packages into zig-pkg/ as root; later builds run as the runner.
          if [ -d zig-pkg ]; then sudo chown -R "$USER" zig-pkg; fi
          # rpmbuild, for the Fedora / RHEL / openSUSE package.
          sudo apt-get install -y -qq rpm

      # .deb, Arch package and .rpm, each for x86_64 and aarch64.
      - name: pack
        run: |
          zig build pack -Dlinux-arch=x86_64 -Dspell-db=zig-out/db/Byakaron.db -- linux linux-arch linux-rpm
          zig build pack -Dlinux-arch=aarch64 -Dspell-db=zig-out/db/Byakaron.db -- linux linux-arch linux-rpm
          ls -l zig-out/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-linux
          path: |
            zig-out/pkg/byakaron_*.deb
            zig-out/pkg/byakaron-*.pkg.tar.zst
            zig-out/pkg/byakaron-*.rpm
          if-no-files-found: error

  pack-macos:
    name: pack (macos)
    needs: prepare
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      - name: pack
        run: zig build pack -Dspell-db=zig-out/db/Byakaron.db -- macos

      - name: sign
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          mnt="$RUNNER_TEMP/mnt"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" zig-out/pkg/Byakaron.dmg
          ditto "$mnt/Byakaron.app" "$stage/Byakaron.app"
          hdiutil detach -quiet "$mnt"
          ln -s /Applications "$stage/Applications"

          sign() {
            codesign --force --timestamp --options runtime \
              --preserve-metadata=entitlements,requirements,flags \
              --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          app="$stage/Byakaron.app"
          find "$app/Contents" -depth \( -name '*.app' -o -name '*.appex' -o -name '*.framework' \
              -o -name '*.bundle' -o -name '*.dylib' -o -name '*.so' \) -print0 |
            while IFS= read -r -d '' code; do sign "$code"; done
          sign "$app"
          codesign --verify --deep --strict "$app"

          rm zig-out/pkg/Byakaron.dmg
          hdiutil create -quiet -volname Byakaron -srcfolder "$stage" -ov -format UDZO zig-out/pkg/Byakaron.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" zig-out/pkg/Byakaron.dmg
          xcrun notarytool submit zig-out/pkg/Byakaron.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple zig-out/pkg/Byakaron.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-macos
          path: zig-out/pkg/Byakaron.dmg
          if-no-files-found: error

  pack-windows:
    name: pack (windows)
    needs: prepare
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      - name: inno
        run: choco install innosetup --no-progress -y

      - name: pack
        env:
          BYAKARON_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: zig build pack "-Dspell-db=zig-out/db/Byakaron.db" -- windows

      - name: sign
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 zig-out/pkg/Byakaron-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          & $signtool.FullName verify /pa zig-out/pkg/Byakaron-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signature does not verify" }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-windows
          path: zig-out/pkg/Byakaron-Setup.exe
          if-no-files-found: error

  pack-android:
    name: pack (android)
    needs: prepare
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: byakaron-android
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      # The keyboard is a private repo pinned by the submodule gitlink.
      - name: keyboard
        id: keyboard
        env:
          DEPLOY_KEY: ${{ secrets.ANDROID_DEPLOY_KEY }}
        run: |
          sha=$(git ls-tree HEAD apps/android/keyboard | awk '$2 == "commit" { print $3 }')
          [[ -n "$sha" ]] || { echo "::error::no gitlink at apps/android/keyboard"; exit 1; }
          [[ -n "$DEPLOY_KEY" ]] || { echo "::error::ANDROID_DEPLOY_KEY unset: cannot clone byakaron-android@$sha"; exit 1; }
          echo "android keyboard@$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nuhulabs/byakaron-android
          ref: ${{ steps.keyboard.outputs.sha }}
          path: apps/android/keyboard
          ssh-key: ${{ secrets.ANDROID_DEPLOY_KEY }}

      # Google Play rejects a versionCode it has seen, so every run gets its
      # own (run number and attempt), above the hand-set ones in the submodule.
      # versionName is the release version.
      - name: version code
        run: |
          gradle=apps/android/keyboard/app/build.gradle.kts
          code=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          sed -i -E \
            -e "s/^([[:space:]]*versionCode = )[0-9]+/\1${code}/" \
            -e "s/^([[:space:]]*versionName = )\"[^\"]*\"/\1\"${VERSION}\"/" \
            "$gradle"
          grep -E '^[[:space:]]*version(Code|Name) = ' "$gradle"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Every ABI in one .apk / .aab.
      - name: pack
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          zig build pack -Dspell-db=zig-out/db/Byakaron.db -- android
          map=apps/android/keyboard/app/build/outputs/mapping/release/mapping.txt
          if [[ -f "$map" ]]; then cp "$map" zig-out/pkg/mapping.txt; fi

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-android
          path: |
            zig-out/pkg/Byakaron.apk
            zig-out/pkg/Byakaron.aab
            zig-out/pkg/mapping.txt
          if-no-files-found: error

  # The iOS app (apps/ios/keyboard, the byakaron-ios submodule) with its
  # keyboard extension, archived for devices. Signed only when the
  # credentials are set; otherwise an unsigned archive still checks that the
  # release builds, and nothing is uploaded.
  #   IOS_CERTIFICATE (+ _PASSWORD)  base64 Apple Distribution .p12
  #   APP_STORE_CONNECT_API_KEY      the .p8 key's contents (App Manager)
  #   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
  # Provisioning profiles come from Xcode's automatic signing with that API
  # key (-allowProvisioningUpdates), for dev.nuhu.labs.KeyboardApp and its
  # keyboard, team 654MC856Z2 (the project's DEVELOPMENT_TEAM).
  pack-ios:
    name: pack (ios)
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
      signed: ${{ steps.signing.outputs.signed }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      - uses: ./.github/actions/ios-keyboard
        with:
          deploy-key: ${{ secrets.IOS_DEPLOY_KEY }}

      # Byakaron.xcframework (which the Xcode project links) and the
      # Settings.bundle; also a simulator build of the app.
      - name: engine
        run: zig build ios

      # App Store versions are at most three numbers (27.0.0-alpha.3 → 27.0.0);
      # the build number is unique per run, as for Google Play.
      - name: version
        working-directory: apps/ios/keyboard
        run: |
          short="${VERSION%%-*}"
          build=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          for plist in HostingApp/Info.plist Keyboard/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $short" -c "Set :CFBundleVersion $build" "$plist"
          done
          echo "iOS $short ($build)"

      - name: signing
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$IOS_CERTIFICATE" || -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::notice::iOS signing credentials are not set; building an unsigned archive (no .ipa)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security import "$RUNNER_TEMP/ios.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/ios.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s\n' "$API_KEY" > "$key"
          {
            echo "signed=true"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

      - name: archive
        working-directory: apps/ios/keyboard
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          API_KEY_PATH: ${{ steps.signing.outputs.key }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          archive="$RUNNER_TEMP/Byakaron.xcarchive"
          args=(-workspace GiellaKeyboard.xcworkspace -scheme HostingApp -configuration Release
                -destination generic/platform=iOS -archivePath "$archive" -quiet)
          if [[ "$SIGNED" != "true" ]]; then
            xcodebuild archive "${args[@]}" CODE_SIGNING_ALLOWED=NO
            exit 0
          fi
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH"
                -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          xcodebuild archive "${args[@]}" "${auth[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          mkdir -p "$GITHUB_WORKSPACE/zig-out/pkg"
          mapfile -t ipas < <(compgen -G "$RUNNER_TEMP/export/*.ipa" || true)
          [[ ${#ipas[@]} -eq 1 ]] || { echo "::error::expected one .ipa, got: ${ipas[*]-<none>}"; exit 1; }
          mv "${ipas[0]}" "$GITHUB_WORKSPACE/zig-out/pkg/Byakaron.ipa"
          ls -l "$GITHUB_WORKSPACE/zig-out/pkg/Byakaron.ipa"

      # The runner may be reused: drop the key and the signing keychain.
      - name: cleanup
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          rm -f "${{ steps.signing.outputs.key }}"
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true

      # Named `ios`, not byakaron-ios: publish-github ships every byakaron-*
      # artifact, and the .ipa goes to the App Store only.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: ios
          path: zig-out/pkg/Byakaron.ipa
          if-no-files-found: error

  # The website: the Worker bundle (wrangler.jsonc's custom build, bundled
  # by a wrangler dry run) and the prerendered static site, plus a deploy
  # config without the build step, so publish-web ships exactly this build
  # with no Zig.
  pack-web:
    name: pack (web)
    needs: prepare
    outputs:
      # prepare's, passed on so publish jobs need only their pack.
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      track: ${{ needs.prepare.outputs.track }}
      publish: ${{ needs.prepare.outputs.publish }}
      create_tag: ${{ needs.prepare.outputs.create_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pack-setup
        with:
          version: ${{ needs.prepare.outputs.version }}
          zig-version: ${{ env.ZIG_VERSION }}

      - name: pack
        working-directory: apps/web
        run: |
          out="$GITHUB_WORKSPACE/zig-out/web"
          npx --yes wrangler@4.100.0 deploy --dry-run --outdir "$out/worker"
          rm -f "$out/worker/README.md"
          cp -R ../../zig-out/static "$out/static"
          # wrangler.jsonc minus the build: the bundle is already built.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const [src, dst] = process.argv.slice(1);
            const c = new Function("return (" + fs.readFileSync(src, "utf8") + ")")();
            delete c.build;
            delete c["$schema"];
            c.main = "worker/main.js";
            c.no_bundle = true;
            c.rules = [{ type: "CompiledWasm", globs: ["**/*.wasm"] }];
            c.assets.directory = "static";
            for (const d of c.d1_databases || []) delete d.migrations_dir;
            fs.writeFileSync(dst, JSON.stringify(c, null, 2) + "\n");
          ' wrangler.jsonc "$out/wrangler.json"
          cat "$out/wrangler.json"
          find "$out" -type f -not -path '*/static/*' -exec ls -l {} +

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: zig-out/web
          if-no-files-found: error

  # ── publish ────────────────────────────────────────────────────────────────
  # One job per destination, each waiting only for the packs it ships.

  # Tag, every binary on Byakaron-Assets, notes on this repo.
  publish-github:
    name: publish (github)
    if: needs.pack-linux.outputs.publish == 'true'
    needs: [pack-linux, pack-macos, pack-windows, pack-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.pack-linux.outputs.version }}
      TAG: ${{ needs.pack-linux.outputs.tag }}
      TRACK: ${{ needs.pack-linux.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dispatched releases: tag the commit that was built. GITHUB_TOKEN pushes
      # do not trigger workflows, so this does not start a second release.
      - name: tag
        if: needs.pack-linux.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "Byakaron ${VERSION}"
            echo
            if [[ -n "$prev" ]]; then
              echo "Changes since ${prev}:"
              echo
              git log --no-merges --format='- %s' "${prev}..HEAD"
            fi
          } > "$RUNNER_TEMP/tag.md"
          git tag -a "$TAG" -F "$RUNNER_TEMP/tag.md" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - uses: actions/download-artifact@v4
        with:
          pattern: byakaron-*
          path: dist
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ secrets.BYAKARON_ASSETS_TOKEN }}
          ASSETS_REPO: nuhulabs/Byakaron-Assets
          SOURCE_REPO: ${{ github.repository }}
          # Source-repo release uses the job token (not the Assets PAT).
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::BYAKARON_ASSETS_TOKEN is not set"; exit 1; }
          cd dist
          # Byakaron.db is baked into the packages; mapping.txt goes to Play only.
          rm -f Byakaron.db mapping.txt

          for f in Byakaron.dmg Byakaron-Setup.exe Byakaron.apk Byakaron.aab; do
            [[ -f "$f" ]] || { echo "::error::$f is missing"; exit 1; }
          done
          for arch in amd64 arm64; do
            mapfile -t matches < <(compgen -G "byakaron_*_${arch}.deb" || true)
            [[ ${#matches[@]} -eq 1 ]] || {
              echo "::error::expected one byakaron_*_${arch}.deb, got: ${matches[*]-<none>}"
              exit 1
            }
            # Stable public name so /releases/latest/download/byakaron_${arch}.deb works.
            mv -f "${matches[0]}" "byakaron_${arch}.deb"
          done
          # The Arch Linux package and the RPM, under stable names as well.
          for arch in x86_64 aarch64; do
            for pattern in "byakaron-*-${arch}.pkg.tar.zst:byakaron_${arch}.pkg.tar.zst" \
                           "byakaron-*.${arch}.rpm:byakaron_${arch}.rpm"; do
              glob="${pattern%%:*}" stable="${pattern#*:}"
              mapfile -t matches < <(compgen -G "$glob" || true)
              [[ ${#matches[@]} -eq 1 ]] || {
                echo "::error::expected one $glob, got: ${matches[*]-<none>}"
                exit 1
              }
              mv -f "${matches[0]}" "$stable"
            done
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          # %(contents) includes the PGP signature on signed tags — strip it.
          git tag -l --format='%(contents)' "$TAG" \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Byakaron ${VERSION}" > "$RUNNER_TEMP/notes.md"

          {
            echo
            echo "---"
            echo
            echo "Installers: https://github.com/${ASSETS_REPO}/releases/tag/${TAG}"
            echo "Latest downloads: https://github.com/${ASSETS_REPO}/releases/latest"
          } >> "$RUNNER_TEMP/notes.md"

          # Only production is the latest release; the others are prereleases
          # (the site and install.sh fall back to the newest one while there
          # is no production release).
          flags=(--latest)
          [[ "$TRACK" != "production" ]] && flags=(--prerelease --latest=false)

          # Public binaries on Byakaron-Assets (stable asset names).
          gh release delete "$TAG" --repo "$ASSETS_REPO" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$ASSETS_REPO" --title "Byakaron ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" ./*

          while read -r sum name; do
            got=$(gh release view "$TAG" --repo "$ASSETS_REPO" --json assets \
              -q ".assets[] | select(.name == \"$name\") | .digest")
            [[ "$got" == "sha256:$sum" ]] || { echo "::error::$name: uploaded $got, built sha256:$sum"; exit 1; }
          done < SHA256SUMS
          echo "https://github.com/$ASSETS_REPO/releases/tag/$TAG"

          # The apps' update feed (src/Update.zig's feed_url): the release
          # list as releases.json on Byakaron-Assets' main branch, a plain
          # file, so it is not held to the API's 60 requests an hour.
          gh api "repos/$ASSETS_REPO/releases?per_page=40" \
            | jq '[.[] | {tag_name, draft, prerelease, published_at, html_url,
                   assets: [.assets[] | {name, browser_download_url, digest, size}]}]' \
            > "$RUNNER_TEMP/releases.json"
          jq -e 'length > 0' "$RUNNER_TEMP/releases.json" > /dev/null
          feed_sha=$(gh api "repos/$ASSETS_REPO/contents/releases.json" -q .sha 2>/dev/null || true)
          [[ "$feed_sha" =~ ^[0-9a-f]{40}$ ]] || feed_sha=""
          jq -n --arg message "releases.json: ${TAG}" --arg sha "$feed_sha" \
                --rawfile content <(base64 -w0 "$RUNNER_TEMP/releases.json") \
                '{message: $message, content: $content} + (if $sha == "" then {} else {sha: $sha} end)' \
            | gh api -X PUT "repos/$ASSETS_REPO/contents/releases.json" --input - > /dev/null
          echo "https://raw.githubusercontent.com/$ASSETS_REPO/main/releases.json"

          # Source repo: release notes only (private clone / changelog), no binaries.
          GH_TOKEN="$SOURCE_TOKEN" gh release delete "$TAG" --repo "$SOURCE_REPO" --yes 2>/dev/null || true
          GH_TOKEN="$SOURCE_TOKEN" gh release create "$TAG" --repo "$SOURCE_REPO" \
            --title "Byakaron ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "https://github.com/$SOURCE_REPO/releases/tag/$TAG"

  # The .aab to Google Play, as soon as the Android pack is done.
  # PLAY_STORE_JSON_KEY (byakaron-android environment) is the JSON key of
  # play-publisher@byakaron.iam.gserviceaccount.com (Cloud project byakaron,
  # Google Play Android Developer API on), which Play Console lets view
  # Byakaron Keyboard and release it to testing tracks only, so production
  # stays manual. The build rolls out to the track's testers at once. Uploads
  # by hand need a versionCode above CI's (see pack-android).
  publish-android:
    name: publish (android)
    # The Play service account releases to testing tracks only: a production
    # release is promoted in Play Console by hand.
    if: needs.pack-android.outputs.publish == 'true' && needs.pack-android.outputs.track != 'production'
    needs: [pack-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: byakaron-android
    concurrency:
      group: publish-android
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: byakaron-android
          path: dist

      - name: check
        env:
          KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          [[ -f dist/Byakaron.aab ]] || { echo "::error::Byakaron.aab is missing"; exit 1; }
          [[ -n "$KEY" ]] || { echo "::error::PLAY_STORE_JSON_KEY is not set in the byakaron-android environment"; exit 1; }
          echo "mapping=$([[ -f dist/mapping.txt ]] && echo dist/mapping.txt)" >> "$GITHUB_ENV"

      - name: google play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.byakaron
          releaseFiles: dist/Byakaron.aab
          releaseName: ${{ needs.pack-android.outputs.version }}
          tracks: ${{ needs.pack-android.outputs.track }}
          status: completed
          mappingFile: ${{ env.mapping }}

  # The .ipa to App Store Connect, where it lands in TestFlight; submitting
  # it for App Store review stays manual. Skipped when pack-ios was not
  # signed (no credentials), so a release without them still succeeds.
  publish-ios:
    name: publish (ios)
    if: needs.pack-ios.outputs.publish == 'true'
    needs: [pack-ios]
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: publish-ios
      cancel-in-progress: false
    steps:
      - name: check
        env:
          SIGNED: ${{ needs.pack-ios.outputs.signed }}
          TAG: ${{ needs.pack-ios.outputs.tag }}
        run: |
          if [[ "$SIGNED" != "true" ]]; then
            echo "::notice::pack-ios was not signed (no iOS credentials); not uploading $TAG to App Store Connect"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        if: env.skip != 'true'
        with:
          name: ios
          path: dist

      - name: app store connect
        if: env.skip != 'true'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          [[ -f dist/Byakaron.ipa ]] || { echo "::error::Byakaron.ipa is missing"; exit 1; }
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY" > ~/.appstoreconnect/private_keys/"AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file dist/Byakaron.ipa \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/"AuthKey_${API_KEY_ID}.p8"

  # The website (and the install.sh it serves), from pack-web's bundle. Its
  # download links and installer point at Byakaron-Assets' latest release,
  # so it does not wait for publish-github.
  # D1 migrations stay local:
  #   zig build gen -Dspell-db=zig-out/db/Byakaron.db -- d1
  #   cd apps/web && npx wrangler d1 migrations apply DB --remote
  publish-web:
    name: publish (web)
    if: needs.pack-web.outputs.publish == 'true'
    needs: [pack-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: byakaron-web
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy --config wrangler.json
