# Release: build and test the packages (cd.yml), then publish them.
#
# A `linux-*` tag (pushed by `apps/linux/scripts/release.sh publish`) runs the
# packages; release.sh then downloads the `byakaron-<arch>` artifacts from this
# run and attaches them to a *public* GitHub Release on nuhulabs/Byakaron-Assets
# (nuhulabs/byakaron is private, so curl cannot download from it), e.g.:
#
#   gh release create linux-0.2.1 apps/linux/build/byakaron_*_amd64.deb \
#     --repo nuhulabs/Byakaron-Assets --title "Linux 0.2.1"
#
# Then: curl -fsSL https://nuhulabs.com/byakaron/install.sh | sudo bash
#
# A release published on this repository also gets the packages attached.
name: release

on:
  push:
    tags: ["linux-*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  cd:
    uses: ./.github/workflows/cd.yml

  attach:
    name: attach to release
    if: github.event_name == 'release'
    needs: cd
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: byakaron-*
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/byakaron_*.deb)
          [[ ${#files[@]} -gt 0 ]]
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
