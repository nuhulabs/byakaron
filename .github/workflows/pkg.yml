# pkg: platform packages (linux / macos / windows / android).
# Caller must have uploaded `byakaron-db` (see prepare.yml).
# Used by release (all four; + version for the Windows installer).
#
# Linux amd64/arm64 package in parallel. Install-matrix lives in ci/cd e2e,
# not here — release only ships artifacts.
name: pkg

on:
  workflow_call:
    inputs:
      linux:
        type: boolean
        default: true
      macos:
        type: boolean
        default: false
      windows:
        type: boolean
        default: false
      android:
        type: boolean
        default: false
      version:
        description: Installer version for Windows (build.zig.zon when empty)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: pkg (linux ${{ matrix.deb_arch }})
    if: inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_arch: x86_64
            deb_arch: amd64
          - zig_arch: aarch64
            deb_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: byakaron-db
          path: zig-out/db

      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps

      - name: pkg
        run: zig build package-linux -Dlinux-arch=${{ matrix.zig_arch }} -Dspell-db=zig-out/db/Byakaron.db

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-linux-${{ matrix.deb_arch }}
          path: zig-out/pkg/byakaron_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  macos:
    name: pkg (macos)
    if: inputs.macos
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: byakaron-db
          path: zig-out/db

      - name: build
        run: zig build release-macos -Dspell-db=zig-out/db/Byakaron.db

      - name: sign
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          mnt="$RUNNER_TEMP/mnt"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" zig-out/pkg/Byakaron.dmg
          ditto "$mnt/Byakaron.app" "$stage/Byakaron.app"
          hdiutil detach -quiet "$mnt"
          ln -s /Applications "$stage/Applications"

          sign() {
            codesign --force --timestamp --options runtime \
              --preserve-metadata=entitlements,requirements,flags \
              --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          app="$stage/Byakaron.app"
          find "$app/Contents" -depth \( -name '*.app' -o -name '*.appex' -o -name '*.framework' \
              -o -name '*.bundle' -o -name '*.dylib' -o -name '*.so' \) -print0 |
            while IFS= read -r -d '' code; do sign "$code"; done
          sign "$app"
          codesign --verify --deep --strict "$app"

          rm zig-out/pkg/Byakaron.dmg
          hdiutil create -quiet -volname Byakaron -srcfolder "$stage" -ov -format UDZO zig-out/pkg/Byakaron.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" zig-out/pkg/Byakaron.dmg
          xcrun notarytool submit zig-out/pkg/Byakaron.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple zig-out/pkg/Byakaron.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-macos
          path: zig-out/pkg/Byakaron.dmg
          if-no-files-found: error

  windows:
    name: pkg (windows)
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: inno
        run: choco install innosetup --no-progress -y

      - uses: actions/download-artifact@v4
        with:
          name: byakaron-db
          path: zig-out/db

      - name: build
        env:
          BYAKARON_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: zig build windows "-Dspell-db=zig-out/db/Byakaron.db"

      - name: sign
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 zig-out/pkg/Byakaron-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          & $signtool.FullName verify /pa zig-out/pkg/Byakaron-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signature does not verify" }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-windows
          path: zig-out/pkg/Byakaron-Setup.exe
          if-no-files-found: error

  android:
    name: pkg (android)
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: keyboard
        id: keyboard
        env:
          DEPLOY_KEY: ${{ secrets.ANDROID_DEPLOY_KEY }}
        run: |
          sha=$(git ls-tree HEAD apps/android/keyboard | awk '$2 == "commit" { print $3 }')
          if [[ -z "$sha" ]]; then
            echo "::warning::no gitlink at apps/android/keyboard — skip android pkg"
            sha=""
          elif [[ -z "$DEPLOY_KEY" ]]; then
            echo "::warning::ANDROID_DEPLOY_KEY unset — cannot clone private byakaron-android@$sha; skip android pkg"
            sha=""
          else
            echo "android keyboard@$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: checkout keyboard
        if: steps.keyboard.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          repository: nuhulabs/byakaron-android
          ref: ${{ steps.keyboard.outputs.sha }}
          path: apps/android/keyboard
          ssh-key: ${{ secrets.ANDROID_DEPLOY_KEY }}

      - uses: mlugg/setup-zig@v2
        if: steps.keyboard.outputs.sha != ''
        with:
          version: 0.17.0

      - name: ndk
        if: steps.keyboard.outputs.sha != ''
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - uses: actions/download-artifact@v4
        if: steps.keyboard.outputs.sha != ''
        with:
          name: byakaron-db
          path: zig-out/db

      - uses: actions/setup-java@v4
        if: steps.keyboard.outputs.sha != ''
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        if: steps.keyboard.outputs.sha != ''

      - name: keystore
        if: steps.keyboard.outputs.sha != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: build
        if: steps.keyboard.outputs.sha != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          zig build release-android \
            -Dandroid-ndk="${{ steps.ndk.outputs.ndk-path }}" \
            -Dspell-db=zig-out/db/Byakaron.db

      - name: stage mapping
        if: steps.keyboard.outputs.sha != ''
        run: |
          map="apps/android/keyboard/app/build/outputs/mapping/release/mapping.txt"
          if [[ -f "$map" ]]; then
            cp "$map" zig-out/pkg/mapping.txt
          fi

      - uses: actions/upload-artifact@v4
        if: steps.keyboard.outputs.sha != ''
        with:
          name: byakaron-android
          path: |
            zig-out/pkg/Byakaron.apk
            zig-out/pkg/Byakaron.aab
            zig-out/pkg/mapping.txt
          if-no-files-found: warn
