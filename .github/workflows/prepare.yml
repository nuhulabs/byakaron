# prepare: spell.db + d1 (+ migrate on main). Shared by cd and release.
name: prepare

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/main' && 'byakaron-web' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: cache spell.db
        id: cache
        uses: actions/cache@v4
        with:
          path: zig-out/db/spell.db
          key: spell-db-${{ hashFiles('build.zig', 'build.zig.zon', 'src/data/**', 'src/build/**') }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: spell.db
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/zig-cache
          sudo chown "$USER" /mnt/zig-cache
          zig build db --cache-dir /mnt/zig-cache
          ls -lh zig-out/db/spell.db

      - name: d1
        run: zig build d1 -Dspell-db=zig-out/db/spell.db

      - name: migrate
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip d1 migrate"
            exit 0
          fi
          npx --yes wrangler@4.100.0 d1 migrations apply DB --remote

      - uses: actions/upload-artifact@v4
        with:
          name: spell-db
          path: zig-out/db/spell.db
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: d1
          path: zig-out/d1
          retention-days: 1
          if-no-files-found: error
