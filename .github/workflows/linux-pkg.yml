# linux-pkg: package amd64+arm64 .debs, install-matrix the amd64 one.
# Caller must have uploaded the `spell-db` artifact (see prepare.yml).
name: linux-pkg

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: pkg (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: spell-db
          path: zig-out/db

      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common

      - name: pkg amd64
        run: zig build package-linux -Dlinux-arch=x86_64 -Dspell-db=zig-out/db/spell.db

      - name: pkg arm64
        run: zig build package-linux -Dlinux-arch=aarch64 -Dspell-db=zig-out/db/spell.db

      - name: install-matrix
        run: |
          deb=$(echo zig-out/pkg/byakaron_*_amd64.deb)
          zig build linux-install-test \
            -Dlinux-arch=x86_64 \
            -Dspell-db=zig-out/db/spell.db \
            -Dlinux-deb="$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-amd64
          path: zig-out/pkg/byakaron_*_amd64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: byakaron-arm64
          path: zig-out/pkg/byakaron_*_arm64.deb
          if-no-files-found: error
