# Build and test every platform on every branch push and pull request.
#
#   test ─┬─ linux (amd64, arm64)
#         ├─ linux-wayland
#         ├─ macos
#         ├─ windows
#         ├─ android
#         └─ web
#
# The Zig unit tests gate the platform builds. Linux targets build against the
# pinned Ubuntu sysroot (`zig build linux` downloads it), so the runner only
# needs packages for running and for the C test helpers (`setup_deps.sh --test`).
# No platform ships a real spell.db here (release.yml does, through cd.yml).
# The Android APK needs the private nuhulabs/byakaron-android submodule, so it is
# built only when the BYAKARON_ANDROID_TOKEN secret is set (see RELEASING.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Test
        run: zig build test

  # Engine, app and IME tests. arm64 on a native GitHub ARM runner, not qemu:
  # the site promises arm64, so the same build and tests have to pass there.
  linux:
    name: Linux (${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo bash apps/linux/scripts/setup_deps.sh --test
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev \
            ibus-gtk4 \
            xvfb \
            dbus-x11 \
            appstream \
            python3-gi \
            gir1.2-gdkpixbuf-2.0 \
            librsvg2-common

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build and test
        run: bash apps/linux/scripts/ci.sh

  # Types into GTK3 and GTK4 apps on a real GNOME Shell Wayland session
  # (headless, private dbus/dconf/ibus), through org.gnome.Mutter.RemoteDesktop:
  # the path a keyboard takes on an "Ubuntu on Wayland" login. Arrow keys,
  # candidates, click-commit, Shift, numerals, and live settings.
  linux-wayland:
    name: Linux (GNOME Wayland)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo bash apps/linux/scripts/setup_deps.sh --test
          sudo apt-get install -y --no-install-recommends \
            gnome-shell mutter dbus-x11 ibus python3-gi \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 libgl1-mesa-dri \
            xdg-desktop-portal gsettings-desktop-schemas

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build linux -Doptimize=ReleaseFast

      - name: Test
        run: bash apps/linux/scripts/gnome_wayland_test.sh

      - name: Show logs
        if: failure()
        run: |
          for f in apps/linux/build/gnome-wayland/*.log; do
            echo "=== $f"; tail -40 "$f"
          done

  # The app through Xcode (Debug, ad-hoc signed); the project needs Xcode 27.
  # The build graph also builds spell.db for the bundle; a one-page bnwiki dump
  # keeps that a seconds-long smoke run.
  macos:
    name: macOS
    needs: [test]
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build macos -Dwiki-dump=.github/ci/bnwiki-tiny.xml

      - name: Verify
        run: codesign --verify --deep --strict zig-out/macos/Byakaron.app

  # The WinUI app + TSF IME in the Inno Setup installer, as on a developer
  # machine, with spell.db from the one-page bnwiki dump.
  windows:
    name: Windows
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # `zig build windows` finds ISCC under Program Files.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: zig build windows -Dwiki-dump=.github/ci/bnwiki-tiny.xml

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: zig-out/windows/Byakaron-Setup.exe
          retention-days: 7
          if-no-files-found: error

  # libbyakaron.so for every ABI against the NDK (`zig build android-libs`),
  # or, when the private keyboard submodule is reachable, those plus the debug
  # APK through Gradle (`zig build android`).
  android:
    name: Android
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check the submodule out at the recorded commit with a token that can
      # read it, or build only the library when there is none.
      - name: Find keyboard submodule
        id: keyboard
        env:
          TOKEN: ${{ secrets.BYAKARON_ANDROID_TOKEN }}
        run: |
          sha=$(git ls-tree HEAD apps/android/keyboard | awk '$2 == "commit" { print $3 }')
          if [[ -z "$sha" ]]; then
            echo "::notice::apps/android/keyboard is not a submodule here; skipping the APK"
          elif [[ -z "$TOKEN" ]]; then
            echo "::notice::BYAKARON_ANDROID_TOKEN is not set; skipping the APK"
            sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout keyboard
        if: steps.keyboard.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          repository: nuhulabs/byakaron-android
          ref: ${{ steps.keyboard.outputs.sha }}
          path: apps/android/keyboard
          token: ${{ secrets.BYAKARON_ANDROID_TOKEN }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      # Also copies each .so into apps/android/keyboard/app/src/main/jniLibs.
      - name: Build library
        if: steps.keyboard.outputs.sha == ''
        run: zig build android-libs -Dandroid-ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Setup Java
        if: steps.keyboard.outputs.sha != ''
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        if: steps.keyboard.outputs.sha != ''
        uses: gradle/actions/setup-gradle@v4

      # The libraries, then Gradle's debug build with them.
      - name: Build APK
        if: steps.keyboard.outputs.sha != ''
        run: zig build android -Dandroid-ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Upload APK
        if: steps.keyboard.outputs.sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: zig-out/android/Byakaron-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: zig-out/android/jniLibs
          retention-days: 7
          if-no-files-found: error

  # The web app (apps/web, ziex): the default install step compiles the server
  # and the client wasm without serving or building spell.db.
  web:
    name: Web
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Doptimize=ReleaseSmall
