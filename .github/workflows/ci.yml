# ci: on every push, the unit tests once, then a build of every platform (a
# matrix, one job each) once they pass.
#
# Kept fast on purpose: no packaging, installers, e2e or install-matrix here.
# Those run in release.yml (packages, live install) and e2e.yml (by hand).
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every module's tests in one run (test/main.zig), plus iAvro parity.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: test
        run: zig build test -Diavro

  build:
    name: build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
          # Tiny wiki dump keeps Byakaron.db cheap.
          - platform: macos
            runs-on: xcode-27
          # The engine as Byakaron.xcframework and the keyboard app (simulator, unsigned).
          - platform: ios
            runs-on: xcode-27
          # The IME DLLs and a Debug build of the app. The installer (dotnet
          # publish + Inno Setup) is release-only: `zig build package-windows`.
          - platform: windows
            runs-on: windows-latest
          # Native libs for every ABI and the debug APK; the signed APK/AAB is release-only (pkg.yml).
          - platform: android
            runs-on: ubuntu-latest
          - platform: web
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The keyboard app is a private repo pinned by the submodule gitlink.
      - name: keyboard (android)
        if: matrix.platform == 'android'
        env:
          DEPLOY_KEY: ${{ secrets.ANDROID_DEPLOY_KEY }}
        run: |
          sha=$(git ls-tree HEAD apps/android/keyboard | awk '$2 == "commit" { print $3 }')
          echo "sha=$sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: matrix.platform == 'android'
        with:
          repository: nuhulabs/byakaron-android
          ref: ${{ env.sha }}
          path: apps/android/keyboard
          ssh-key: ${{ secrets.ANDROID_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'

      # The keyboard app is a private repo pinned by the submodule gitlink.
      - name: keyboard (ios)
        if: matrix.platform == 'ios'
        run: echo "ios_sha=$(git ls-tree HEAD apps/ios/keyboard | awk '$2 == "commit" { print $3 }')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: matrix.platform == 'ios'
        with:
          repository: nuhulabs/byakaron-ios
          ref: ${{ env.ios_sha }}
          path: apps/ios/keyboard
          ssh-key: ${{ secrets.IOS_DEPLOY_KEY }}

      - name: deps (linux)
        if: matrix.platform == 'linux'
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps -- --test
          # sudo fetched packages into zig-pkg/ as root; later builds run as the runner.
          if [ -d zig-pkg ]; then sudo chown -R "$USER" zig-pkg; fi
      - name: build (linux)
        if: matrix.platform == 'linux'
        run: zig build linux -Dlinux-system-libs -Dwiki-dump=.github/ci/bnwiki-tiny.xml
      - name: build (macos)
        if: matrix.platform == 'macos'
        run: |
          zig build macos -Dwiki-dump=.github/ci/bnwiki-tiny.xml
          codesign --verify --deep --strict zig-out/bin/Byakaron.app
      - name: build (ios)
        if: matrix.platform == 'ios'
        run: |
          (cd apps/ios/keyboard && pod install)
          zig build ios
      - name: build (windows)
        if: matrix.platform == 'windows'
        run: zig build windows
      - name: build (android)
        if: matrix.platform == 'android'
        run: zig build android
      - name: build (web)
        if: matrix.platform == 'web'
        run: zig build -Doptimize=ReleaseSmall
