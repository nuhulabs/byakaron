# ci: unit tests + a build of every platform, one job each, on every push.
#
# Kept fast on purpose: no packaging, installers, e2e or install-matrix here.
# Those run in release.yml (packages, live install) and e2e.yml (by hand).
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          # sudo fetched packages into zig-pkg/ as root; later builds run as the runner.
          if [ -d zig-pkg ]; then sudo chown -R "$USER" zig-pkg; fi
      - name: test
        run: zig build test -Diavro
      - name: build
        run: zig build linux

  macos:
    name: macos
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: test
        run: zig build test -Diavro
      # Tiny wiki dump keeps Byakaron.db cheap.
      - name: build
        run: |
          zig build macos -Dwiki-dump=.github/ci/bnwiki-tiny.xml
          codesign --verify --deep --strict zig-out/bin/Byakaron.app

  # The IME DLLs and a Debug build of the app. The installer (dotnet publish +
  # Inno Setup) is release-only: the csproj copies native files only when present.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: build (ime)
        run: zig build windows-ime
      - name: build (app)
        run: dotnet build apps/windows/Byakaron/Byakaron.csproj -c Debug -p:Platform=x64

  # Native libs for every ABI; APK/AAB packaging is release-only (pkg.yml).
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: build
        run: zig build android-libs -Dandroid-ndk="${{ steps.ndk.outputs.ndk-path }}"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: build
        run: zig build -Doptimize=ReleaseSmall
