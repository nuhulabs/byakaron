# Build and test on every branch push and pull request.
#
# Each job is a matrix over `os` / `arch` so other platforms can join later.
# Linux targets build against the pinned Ubuntu sysroot (`zig build linux`
# downloads it), so the runner only needs packages for running and for the C
# test helpers (`setup_deps.sh --test`).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: linux engine + app + tests (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # arm64 on a native GitHub ARM runner, not qemu: the site promises arm64,
    # so the same build and tests have to pass there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo bash apps/linux/scripts/setup_deps.sh --test
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev \
            ibus-gtk4 \
            xvfb \
            dbus-x11 \
            appstream \
            python3-gi \
            gir1.2-gdkpixbuf-2.0 \
            librsvg2-common

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build, smoke, IME test
        run: bash apps/linux/scripts/ci.sh

  # Types into GTK3 and GTK4 apps on a real GNOME Shell Wayland session
  # (headless, private dbus/dconf/ibus), through org.gnome.Mutter.RemoteDesktop:
  # the path a keyboard takes on an "Ubuntu on Wayland" login. Arrow keys,
  # candidates, click-commit, Shift, numerals, and live settings.
  linux-wayland:
    name: linux GNOME Wayland typing
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo bash apps/linux/scripts/setup_deps.sh --test
          sudo apt-get install -y --no-install-recommends \
            gnome-shell mutter dbus-x11 ibus python3-gi \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 libgl1-mesa-dri \
            xdg-desktop-portal gsettings-desktop-schemas

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build the engine
        run: zig build linux -Doptimize=ReleaseFast

      - name: Type on GNOME Shell (Wayland)
        run: bash apps/linux/scripts/gnome_wayland_test.sh

      - name: Logs on failure
        if: failure()
        run: |
          for f in apps/linux/build/gnome-wayland/*.log; do
            echo "=== $f"; tail -40 "$f"
          done
