# e2e: the slow end-to-end checks, run by hand (Actions → e2e → Run).
#   wayland        type into GTK3/GTK4 apps on a headless GNOME Shell
#   install-matrix package the .deb and the Arch package, install them in clean
#                  Docker images (Ubuntu, Debian, archlinux)
#   ios            KeyboardUITests on an iPhone x iOS matrix: one iPhone per
#                  screen width on each iOS picked, every one checked by
#                  `zig build e2e -- ios` (keys line up with the system
#                  keyboard's, the switch does not flicker)
name: e2e

on:
  workflow_dispatch:
    inputs:
      ios-os:
        description: "iOS versions for the ios matrix (`zig build e2e -- ios --os`): 27+, 27.0, ..."
        default: "27+"
      ios-devices:
        description: "iPhone names for the ios matrix, comma-separated globs (`zig build e2e -- ios --devices`)"
        default: "iPhone 1*,iPhone Air*"

permissions:
  contents: read

jobs:
  wayland:
    name: e2e (wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build deps -- linux --test
          # sudo fetched packages into zig-pkg/ as root; later builds run as the runner.
          if [ -d zig-pkg ]; then sudo chown -R "$USER" zig-pkg; fi
          sudo apt-get install -y --no-install-recommends \
            gnome-shell mutter dbus-x11 ibus libgtk-4-dev libgl1-mesa-dri \
            xdg-desktop-portal gsettings-desktop-schemas
      - name: e2e
        run: zig build e2e -- linux-wayland

  install-matrix:
    name: e2e (install-matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build deps -- linux
          # sudo fetched packages into zig-pkg/ as root; later builds run as the runner.
          if [ -d zig-pkg ]; then sudo chown -R "$USER" zig-pkg; fi
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
      # Tiny wiki dump keeps Byakaron.db cheap.
      - name: e2e
        run: |
          zig build pack -Dlinux-arch=x86_64 -Dwiki-dump=.github/ci/bnwiki-tiny.xml -- linux linux-arch
          deb=$(echo zig-out/pkg/byakaron_*_amd64.deb)
          pkg=$(echo zig-out/pkg/byakaron-*-x86_64.pkg.tar.zst)
          zig build e2e \
            -Dlinux-arch=x86_64 \
            -Dspell-db=zig-out/db/Byakaron.db \
            -Dlinux-deb="$deb" \
            -Dlinux-arch-pkg="$pkg" \
            -- linux-install

  # Builds the app and KeyboardUITests once, and works out the matrix on the
  # runner's simulators with the same rules as a local run (`--list --json`).
  ios-build:
    name: e2e (ios build)
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: keyboard (ios)
        run: echo "ios_sha=$(git ls-tree HEAD apps/ios/keyboard | awk '$2 == "commit" { print $3 }')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: nuhulabs/byakaron-ios
          ref: ${{ env.ios_sha }}
          path: apps/ios/keyboard
          ssh-key: ${{ secrets.IOS_DEPLOY_KEY }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: build
        run: |
          (cd apps/ios/keyboard && pod install)
          zig build ios
          cd apps/ios/keyboard
          xcodebuild build-for-testing -workspace GiellaKeyboard.xcworkspace \
            -scheme KeyboardUITests -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData/E2E/Build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: matrix
        id: matrix
        env:
          OS: ${{ inputs.ios-os }}
          DEVICES: ${{ inputs.ios-devices }}
        run: |
          zig build e2e -- ios --list --json --os "$OS" --devices "$DEVICES" > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-products
          path: apps/ios/keyboard/DerivedData/E2E/Build/Build/Products
          retention-days: 1
          if-no-files-found: error

  ios:
    name: e2e (ios, ${{ matrix.device }}, iOS ${{ matrix.os }})
    needs: ios-build
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Simulators are heavy: more than two at once on one Mac time out.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.ios-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: keyboard (ios)
        run: echo "ios_sha=$(git ls-tree HEAD apps/ios/keyboard | awk '$2 == "commit" { print $3 }')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: nuhulabs/byakaron-ios
          ref: ${{ env.ios_sha }}
          path: apps/ios/keyboard
          ssh-key: ${{ secrets.IOS_DEPLOY_KEY }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/download-artifact@v4
        with:
          name: ios-e2e-products
          path: ${{ runner.temp }}/products
      - name: e2e
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          (cd apps/ios/keyboard && pod install)
          zig build e2e -- ios --products "$RUNNER_TEMP/products" --devices "$DEVICE" --os "$OS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-e2e-${{ matrix.device }}-${{ matrix.os }}
          path: apps/ios/keyboard/DerivedData/E2E/Results
          if-no-files-found: ignore
