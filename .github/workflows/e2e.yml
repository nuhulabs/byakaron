# e2e: the slow end-to-end checks, run by hand (Actions → e2e → Run). One job
# per suite, each `zig build e2e -- <suite>` as run locally:
#
#   linux-wayland  type into GTK3/GTK4 apps on a headless GNOME Shell
#   linux-install  pack the .deb and the Arch package and install them in
#                  clean Docker images (Ubuntu, Debian, archlinux)
#   ios-build      build the app and KeyboardUITests once, and pick the
#                  iPhone x iOS matrix from the runner's simulators (one
#                  iPhone per screen width on each iOS, as a local run does)
#   ios            one job per iPhone x iOS on those products: Byakaron's keys
#                  line up with the system keyboard's, the switch does not
#                  flicker. Screenshots, video and report.json are uploaded
#                  as ios-e2e-<iPhone>-<iOS>.
name: e2e

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which OS to test
        type: choice
        options: [all, linux, ios]
        default: all
      ios-os:
        description: "iOS versions (`--os`): 27+, 27.2, 27.0,27.2, ..."
        default: "27+"
      ios-devices:
        description: "iPhones (`--devices`), comma-separated globs"
        default: "iPhone 1*,iPhone Air*"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ── linux ──────────────────────────────────────────────────────────────────
  # apt directly rather than `sudo zig build deps`: one update, one install,
  # and no root-owned Zig cache.

  linux-wayland:
    name: e2e (linux-wayland)
    if: inputs.os != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runtime set plus the C toolchain and -dev packages the test helpers
      # build with (`zig build deps -- linux --test`), and a headless GNOME
      # Shell, without recommends (they would pull in a display manager).
      - name: deps
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq >/dev/null \
            ibus ibus-gtk3 ibus-gtk4 libglib2.0-bin gettext librsvg2-common \
            build-essential pkg-config libibus-1.0-dev libglib2.0-dev libgtk-3-dev libgtk-4-dev
          sudo -E apt-get install -y -qq --no-install-recommends >/dev/null \
            gnome-shell mutter dbus-x11 libgl1-mesa-dri xdg-desktop-portal gsettings-desktop-schemas
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: e2e
        run: zig build e2e -- linux-wayland

  linux-install:
    name: e2e (linux-install)
    if: inputs.os != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # What packing needs (msgfmt, glib-compile-schemas); the installs run in Docker.
      - name: deps
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq >/dev/null ibus ibus-gtk3 libglib2.0-bin gettext
          sudo -E apt-get install -y -qq --no-install-recommends >/dev/null xvfb dbus-x11
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The tiny wiki dump keeps Byakaron.db cheap.
      - name: pack
        run: zig build pack -Dlinux-arch=x86_64 -Dwiki-dump=.github/ci/bnwiki-tiny.xml -- linux linux-arch
      - name: e2e
        run: |
          zig build e2e \
            -Dlinux-arch=x86_64 \
            -Dspell-db=zig-out/db/Byakaron.db \
            -Dlinux-deb="$(echo zig-out/pkg/byakaron_*_amd64.deb)" \
            -Dlinux-arch-pkg="$(echo zig-out/pkg/byakaron-*-x86_64.pkg.tar.zst)" \
            -- linux-install

  # ── ios ────────────────────────────────────────────────────────────────────

  ios-build:
    name: e2e (ios build)
    if: inputs.os != 'linux'
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: ./.github/actions/ios-keyboard
        with:
          deploy-key: ${{ secrets.IOS_DEPLOY_KEY }}
      # `--list` also builds zig-out/lib/ios/Byakaron.xcframework, which the
      # Xcode project links.
      - name: matrix
        id: matrix
        env:
          OS: ${{ inputs.ios-os }}
          DEVICES: ${{ inputs.ios-devices }}
        run: |
          xcrun simctl list runtimes
          matrix=$(zig build e2e -- ios --list --json --os "$OS" --devices "$DEVICES")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: build
        working-directory: apps/ios/keyboard
        run: |
          xcodebuild build-for-testing -quiet -workspace GiellaKeyboard.xcworkspace \
            -scheme KeyboardUITests -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData/E2E/Build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-products
          path: apps/ios/keyboard/DerivedData/E2E/Build/Build/Products
          retention-days: 1
          if-no-files-found: error

  ios:
    name: e2e (ios ${{ matrix.os }}, ${{ matrix.device }})
    needs: ios-build
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Simulators are heavy: more than two at once on one Mac time out.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.ios-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: ./.github/actions/ios-keyboard
        with:
          deploy-key: ${{ secrets.IOS_DEPLOY_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: ios-e2e-products
          path: ${{ runner.temp }}/products
      # The prebuilt app and tests (`--products`): no build here.
      - name: e2e
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: zig build e2e -- ios --products "$RUNNER_TEMP/products" --devices "$DEVICE" --os "$OS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-e2e-${{ matrix.device }}-${{ matrix.os }}
          path: apps/ios/keyboard/DerivedData/E2E/Results
          if-no-files-found: ignore
