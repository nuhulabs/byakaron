# cd: prepare → linux pkg (+ install-matrix) + web deploy
#
# Platform installers (macos/windows/android) are built only in release.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  linux:
    name: linux
    needs: [prepare]
    uses: ./.github/workflows/linux-pkg.yml

  web:
    name: build (web)
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'byakaron-web' || '' }}
    concurrency:
      group: cd-build-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: spell-db
          path: zig-out/db

      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: d1
          path: zig-out/d1

      - name: deploy
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy

      - name: build
        if: github.ref != 'refs/heads/main'
        run: zig build -Doptimize=ReleaseSmall
