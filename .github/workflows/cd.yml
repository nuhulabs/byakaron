# cd: build → pkg (per os). called by release; deploys web on main.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: cache
        id: cache
        uses: actions/cache@v4
        with:
          path: zig-out/db/spell.db
          key: spell-db-${{ hashFiles('build.zig', 'build.zig.zon', 'src/data/**', 'src/build/**') }}

      - uses: mlugg/setup-zig@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: 0.17.0

      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/zig-cache
          sudo chown "$USER" /mnt/zig-cache
          zig build db --cache-dir /mnt/zig-cache
          ls -lh zig-out/db/spell.db

      - uses: actions/upload-artifact@v4
        with:
          name: spell-db
          path: zig-out/db/spell.db
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  build:
    name: build (${{ matrix.os }})
    needs: [db]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch: amd64
          - os: linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - os: macos
            runner: xcode-27
            placeholder: true
          - os: windows
            runner: windows-latest
            placeholder: true
          - os: android
            runner: ubuntu-latest
            placeholder: true

    steps:
      - uses: actions/checkout@v4

      - name: placeholder
        if: ${{ matrix.placeholder }}
        run: echo "placeholder: ${{ matrix.os }} packages are built in release"

      - uses: mlugg/setup-zig@v2
        if: ${{ !matrix.placeholder }}
        with:
          version: 0.17.0

      - name: deps
        if: matrix.os == 'linux'
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common docker.io

      - uses: actions/download-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: spell-db
          path: zig-out/db

      - name: pkg
        if: matrix.os == 'linux'
        run: zig build package-linux -Dspell-db=zig-out/db/spell.db

      - name: test pkg
        if: matrix.os == 'linux'
        run: zig build linux-install-test -Dspell-db=zig-out/db/spell.db

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: byakaron-${{ matrix.arch }}
          path: zig-out/pkg/byakaron_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  web:
    name: web
    if: github.ref == 'refs/heads/main'
    needs: [db]
    environment:
      name: byakaron-web
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cd-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: spell-db
          path: zig-out/db

      - name: d1
        run: zig build d1 -Dspell-db=zig-out/db/spell.db

      - name: migrate
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip web deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 d1 migrations apply DB --remote

      - name: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "skip deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy
