# cd: prepare → build (os matrix) → test (os matrix)
#
# prepare: spell.db + d1 (+ migrate on main)
# build:   one linux runner packages amd64+arm64 .debs; web deploys
# test:    install-matrix against the built amd64 .deb
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/main' && 'byakaron-web' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: cache spell.db
        id: cache
        uses: actions/cache@v4
        with:
          path: zig-out/db/spell.db
          key: spell-db-${{ hashFiles('build.zig', 'build.zig.zon', 'src/data/**', 'src/build/**') }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: spell.db
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/zig-cache
          sudo chown "$USER" /mnt/zig-cache
          zig build db --cache-dir /mnt/zig-cache
          ls -lh zig-out/db/spell.db

      - name: d1
        run: zig build d1 -Dspell-db=zig-out/db/spell.db

      - name: migrate
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip d1 migrate"
            exit 0
          fi
          npx --yes wrangler@4.100.0 d1 migrations apply DB --remote

      - uses: actions/upload-artifact@v4
        with:
          name: spell-db
          path: zig-out/db/spell.db
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: d1
          path: zig-out/d1
          retention-days: 1
          if-no-files-found: error

  build:
    name: build (${{ matrix.os }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: xcode-27
            placeholder: true
          - os: windows
            runner: windows-latest
            placeholder: true
          - os: android
            runner: ubuntu-latest
            placeholder: true
          - os: web
            runner: ubuntu-latest

    environment: ${{ matrix.os == 'web' && github.ref == 'refs/heads/main' && 'byakaron-web' || '' }}
    concurrency:
      group: cd-build-${{ matrix.os }}
      cancel-in-progress: ${{ matrix.os != 'web' }}

    steps:
      - uses: actions/checkout@v4

      - name: placeholder
        if: ${{ matrix.placeholder }}
        run: echo "placeholder — ${{ matrix.os }} packages are built in release"

      - uses: mlugg/setup-zig@v2
        if: ${{ !matrix.placeholder }}
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        if: ${{ !matrix.placeholder && (matrix.os == 'linux' || matrix.os == 'web') }}
        with:
          name: spell-db
          path: zig-out/db

      # —— linux: both .debs from one amd64 runner (zig sysroot cross) ——
      - name: deps
        if: matrix.os == 'linux'
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common

      - name: pkg amd64
        if: matrix.os == 'linux'
        run: zig build package-linux -Dlinux-arch=x86_64 -Dspell-db=zig-out/db/spell.db

      - name: pkg arm64
        if: matrix.os == 'linux'
        run: zig build package-linux -Dlinux-arch=aarch64 -Dspell-db=zig-out/db/spell.db

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: byakaron-amd64
          path: zig-out/pkg/byakaron_*_amd64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: byakaron-arm64
          path: zig-out/pkg/byakaron_*_arm64.deb
          if-no-files-found: error

      # —— web: deploy only (d1 + migrate already ran in prepare) ——
      - uses: actions/download-artifact@v4
        if: matrix.os == 'web' && github.ref == 'refs/heads/main'
        with:
          name: d1
          path: zig-out/d1

      - name: deploy
        if: matrix.os == 'web' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy

      - name: build
        if: matrix.os == 'web' && github.ref != 'refs/heads/main'
        run: zig build -Doptimize=ReleaseSmall

  test:
    name: test (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: ubuntu-latest
            placeholder: true
          - os: windows
            runner: ubuntu-latest
            placeholder: true
          - os: android
            runner: ubuntu-latest
            placeholder: true
          - os: web
            runner: ubuntu-latest
            placeholder: true

    steps:
      - uses: actions/checkout@v4

      - name: placeholder
        if: ${{ matrix.placeholder }}
        run: echo "placeholder — no ${{ matrix.os }} pkg test yet"

      - uses: mlugg/setup-zig@v2
        if: ${{ !matrix.placeholder }}
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: spell-db
          path: zig-out/db

      - name: deps
        if: matrix.os == 'linux'
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common

      # Builds the host-arch .deb and runs it through clean containers.
      - name: pkg
        if: matrix.os == 'linux'
        run: zig build linux-install-test -Dlinux-arch=x86_64 -Dspell-db=zig-out/db/spell.db
