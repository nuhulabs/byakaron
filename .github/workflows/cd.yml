# cd: prepare (Byakaron.db) ∥ web deploy + linux install-matrix e2e
#
# Platform release packages are release/pkg.yml only. D1 migrate is local.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  web:
    name: build (web)
    # No needs: prepare — Worker deploy does not use Byakaron.db; D1 migrations are local.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'byakaron-web' || '' }}
    concurrency:
      group: cd-build-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # wrangler.jsonc runs `zig build zx …` as a custom build before deploy.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Worker deploy only — D1 schema/data migrations are applied locally when needed:
      #   zig build d1 -Dspell-db=zig-out/db/Byakaron.db
      #   cd apps/web && npx wrangler d1 migrations apply DB --remote
      - name: deploy
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset; skip deploy"
            exit 0
          fi
          npx --yes wrangler@4.100.0 deploy

      - name: build
        if: github.ref != 'refs/heads/main'
        run: zig build -Doptimize=ReleaseSmall

  e2e:
    name: e2e (linux install-matrix)
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/download-artifact@v4
        with:
          name: byakaron-db
          path: zig-out/db

      - name: deps
        run: |
          sudo -E env "PATH=$PATH" \
            ZIG_LOCAL_CACHE_DIR=/tmp/zig-deps ZIG_GLOBAL_CACHE_DIR=/tmp/zig-deps \
            zig build linux-deps
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common

      - name: pkg amd64
        run: zig build package-linux -Dlinux-arch=x86_64 -Dspell-db=zig-out/db/Byakaron.db

      - name: install-matrix
        run: |
          deb=$(echo zig-out/pkg/byakaron_*_amd64.deb)
          zig build linux-install-test \
            -Dlinux-arch=x86_64 \
            -Dspell-db=zig-out/db/Byakaron.db \
            -Dlinux-deb="$deb"
